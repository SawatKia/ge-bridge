[package]
name = "ge-bridge"
version = "2.0.0"
edition = "2021"
description = "Lightweight Windows System-Tray Local AI Server bridging Gemini Enterprise web to OpenMausBot and universal AI harnesses"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-std", "io-util"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
tray-icon = "0.19"
keyring = { version = "3", features = ["windows-native"] }
arboard = "3.4"
dirs = "5.0"
open = "5.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Shell"
] }
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
